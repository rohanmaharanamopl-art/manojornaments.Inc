<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Page not found | Manoj Ornaments</title>
<style>
:root { --bg: #faf8f5; --ink: #1f1b16; --muted: #625a50; --gold: #966c34; --ongold: #ffffff; --line: #e8dfd1; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161310; --ink: #f5efe5; --muted: #b0a698; --gold: #c9a872; --ongold: #181410; --line: #423a31; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 32rem; text-align: center; }
.brand { font: 600 1.1rem Georgia, "Times New Roman", serif; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 1.2rem 0 .4rem; font: 600 clamp(2.2rem, 8vw, 3.2rem)/1.1 Georgia, "Times New Roman", serif; }
p { margin: 0 0 1.6rem; color: var(--muted); }
a.btn { display: inline-block; padding: .8rem 1.4rem; border-radius: .6rem; background: var(--gold); color: var(--ongold); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; }
a.btn:hover { filter: brightness(.92); }
a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="brand">Manoj Ornaments</div>
  <h1>Page not found</h1>
  <p>The page you are looking for has moved or does not exist. Our jewelry collection is still just a click away.</p>
  <a class="btn" href="/">Back to home</a>
</main>
</body>
</html>
